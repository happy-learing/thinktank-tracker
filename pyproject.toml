[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinktank-tracker"
version = "0.1.0"
description = "Portable local workflow for tracking and reviewing think-tank research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "playwright>=1.50,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "python-dateutil>=2.9,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[project.scripts]
thinktank-tracker = "thinktank_tracker.launcher:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["app"]
